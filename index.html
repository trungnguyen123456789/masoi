<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍈 VUA SẦU RIÊNG - Ma Sói Lớp Học</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --durian: #FDE047; --durian-dark: #EAB308; --green-light: #BBF7D0; --green-main: #4ADE80;
            --danger: #FDA4AF; --danger-dark: #E11D48; --dark: #1E293B; --bg-body: #F0FDF4; --white: #FFFFFF;
            --shadow-solid: 4px 4px 0px var(--dark); --shadow-solid-sm: 2px 2px 0px var(--dark);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        
        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(var(--green-light) 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--dark);
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 20px 0 5px;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                -2px -2px 0 var(--dark),  
                 2px -2px 0 var(--dark),
                -2px  2px 0 var(--dark),
                 2px  2px 0 var(--dark),
                 4px  4px 0 var(--dark);
        }
        
        .subtitle { 
            font-size: 1.3rem; color: var(--dark); margin-bottom: 30px; font-weight: 600;
            background: var(--durian); display: inline-block; padding: 5px 15px;
            border-radius: 20px; border: 2px solid var(--dark); box-shadow: var(--shadow-solid-sm);
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; }

        .comic-panel {
            background: var(--white); border: 3px solid var(--dark); border-radius: 24px;
            padding: 40px 30px; box-shadow: var(--shadow-solid); margin: 0 auto; position: relative;
        }

        #menu-screen { min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .menu-panel { max-width: 450px; width: 100%; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .floating-durian { position: absolute; font-size: 2.5rem; animation: bounce 2s infinite alternate ease-in-out; z-index: 10; }

        @keyframes bounce {
            from { transform: translateY(0) rotate(-10deg); }
            to { transform: translateY(-15px) rotate(10deg); }
        }

        button {
            background: var(--durian); color: var(--dark); border: 3px solid var(--dark); padding: 14px 28px; 
            margin: 8px 6px; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0px 5px 0px var(--dark); transition: all 0.1s ease; text-transform: uppercase;
        }
        
        button:hover:not(:disabled) { background: var(--durian-dark); transform: translateY(2px); box-shadow: 0px 3px 0px var(--dark); }
        button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0px 0px 0px var(--dark); }
        
        button[style*="background:#666"], button[style*="background:#555"], button[style*="background:#CBD5E1"] { background: #CBD5E1 !important; }
        button[style*="background:#666"]:hover, button[style*="background:#555"]:hover, button[style*="background:#CBD5E1"]:hover { background: #94A3B8 !important; }
        
        button[style*="background:#f00"], button[style*="background:var(--danger)"] { background: var(--danger) !important; }
        button[style*="background:#f00"]:hover, button[style*="background:var(--danger)"]:hover { background: var(--danger-dark) !important; }
        
        button[style*="background:#0f3460"], button[style*="background:#93C5FD"] { background: #93C5FD !important; }

        button:disabled { 
            background: #E2E8F0 !important; color: #94A3B8 !important; cursor: not-allowed; 
            box-shadow: 0px 5px 0px #94A3B8 !important; border-color: #94A3B8; transform: none !important;
        }

        input, select {
            padding: 16px 24px; font-size: 18px; font-weight: 600; border-radius: 16px; border: 3px solid var(--dark);
            background: var(--white); color: var(--dark); width: 100%; max-width: 320px; margin: 15px auto; 
            text-align: center; box-shadow: inset 0px 4px 0px rgba(0,0,0,0.05); outline: none; display: block;
        }
        input:focus { border-color: var(--durian-dark); background: #FEF9C3; }

        .deck-container {
            position: relative; width: 100%; min-height: 480px; margin: 20px auto; display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: center; background: var(--green-main); border-radius: 24px; 
            border: 4px solid var(--dark); box-shadow: inset 0px 8px 0px rgba(0,0,0,0.1), var(--shadow-solid); 
            overflow: hidden; padding: 20px;
        }
        
        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .deal-card {
            width: 110px; height: 160px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); 
            opacity: 0; cursor: pointer; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d;
        }
        .deal-card.spread { position: relative; top: auto; left: auto; transform: translate(0, 0) scale(1); opacity: 1; margin: -10px 8px; }
        .deal-card.spread:hover { transform: translateY(-10px) rotate(-5deg); z-index: 5; }
        .deal-card.fade-out { transform: scale(0) translateY(100px); opacity: 0; pointer-events: none; }
        .deal-card.selected-center { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.8); z-index: 999; opacity: 1; margin: 0; }
        
        .deal-card-inner {
            position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d; border-radius: 12px; box-shadow: var(--shadow-solid);
        }
        .deal-card.flipped .deal-card-inner { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 3px solid var(--dark);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background: var(--white); overflow: hidden;
        }
        .card-face.front { background: var(--durian); background-image: radial-gradient(var(--durian-dark) 2px, transparent 2px); background-size: 15px 15px; }
        .card-face.back { transform: rotateY(180deg); background: #FEF08A; }
        
        .role-name { font-size: 16px !important; font-weight: 700; color: var(--dark); margin-bottom: 5px; line-height: 1.1; }
        .role-badge { background: var(--white); color: var(--dark); padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; border: 2px solid var(--dark); margin-bottom: 6px; }
        .card-face.back p { font-size: 10px !important; line-height: 1.3; color: var(--dark); font-weight: 500; }
        
        .status { font-size: 1.2rem; font-weight: 600; margin: 10px 0 20px; color: var(--dark); }
        .player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
        .player-item {
            background: var(--white); padding: 10px 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
            border: 3px solid var(--dark); box-shadow: var(--shadow-solid-sm); display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 140px;
        }
        .player-item.dead { opacity: 0.6; background: #CBD5E1; text-decoration: line-through; border-style: dashed; }
        
        .timer {
            font-size: 3.5rem; font-weight: 700; color: var(--dark); margin: 10px 0; background: var(--durian);
            display: inline-block; padding: 5px 30px; border-radius: 24px; border: 4px solid var(--dark); box-shadow: var(--shadow-solid);
        }
        
        .chat-box {
            height: 220px; overflow-y: auto; background: var(--white); border-radius: 16px; padding: 15px; text-align: left;
            margin: 15px auto; border: 3px solid var(--dark); box-shadow: inset 0px 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 8px;
        }
        .chat-message {
            padding: 10px 14px; border-radius: 16px; border-bottom-left-radius: 0px; max-width: 85%; font-size: 1rem;
            background: #E2E8F0; color: var(--dark); border: 2px solid var(--dark); align-self: flex-start; font-weight: 500;
        }
        .chat-message.self { background: var(--durian); align-self: flex-end; border-bottom-left-radius: 16px; border-bottom-right-radius: 0px; }
        .chat-message.ghost { background: #F1F5F9; border: 2px dashed #94A3B8; color: #64748b; font-style: italic; }
        
        .phase-header {
            font-size: 1.8rem; font-weight: 700; padding: 15px 30px; border-radius: 20px; margin: 0 auto 20px;
            background: var(--white); border: 4px solid var(--dark); box-shadow: var(--shadow-solid); display: inline-block;
        }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F1F5F9; border-left: 2px solid var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--dark); border-radius: 10px; }

        /* TỐI ƯU MOBILE */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            h1 { font-size: 2rem; margin-top: 10px; }
            .subtitle { font-size: 1.1rem; padding: 4px 12px; margin-bottom: 20px; }
            .comic-panel { padding: 20px 15px; border-radius: 16px; border-width: 2px; }
            .deal-card { width: 90px; height: 135px; }
            .deal-card.spread { margin: -15px 2px; }
            .deal-card.selected-center { transform: translate(-50%, -50%) scale(2.2); }
            input, select { padding: 12px 16px; font-size: 16px; border-width: 2px; width: 100%; max-width: none; }
            button { width: 100%; margin: 6px 0; padding: 12px; font-size: 16px; border-width: 2px; display: block; box-sizing: border-box; }
            .player-item { width: 100%; flex-direction: row; padding: 12px; justify-content: space-between; font-size: 1rem; margin-bottom: 5px; }
            .timer { font-size: 2.2rem; padding: 5px 15px; }
            .phase-header { font-size: 1.4rem; padding: 10px 20px; width: 100%; }
            .deck-container { padding: 10px; min-height: 400px; }
            .chat-box { height: 180px; }
            #nightActionPanel, #dayPhase { padding: 15px; }
            .floating-durian { font-size: 1.8rem; }
        }
        
        .show-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        #vetoOverlay, #phoneOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(30, 41, 59, 0.85); z-index: 9999; display: flex; 
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }

        .player-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px;
        }
        .player-grid button {
            margin: 0; padding: 12px 15px; font-size: 16px; flex: 1 1 auto; min-width: 80px; max-width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="menu-screen">
            <div style="position: relative; margin-bottom: 25px;">
                <h1>VUA SẦU RIÊNG</h1>
                <div class="subtitle">Di Sản Vua Sầu Riêng🎒</div>
                <span class="floating-durian" style="top:-10px; left:-20px;">🍈</span>
                <span class="floating-durian" style="bottom:20px; right:-20px; animation-delay:1s; font-size:2rem; transform: scaleX(-1);">🍈</span>
            </div>
            
            <div class="comic-panel menu-panel">
                <div id="nameInputSection">
                    <input type="text" id="playerName" placeholder="Nhập tên của bạn vào đây!" maxlength="20">
                    <button onclick="confirmName()">✅ CHỐT TÊN</button>
                </div>
                
                <div id="nameConfirmedSection" class="hidden">
                    <p style="font-size:1.2rem; margin-bottom: 20px; font-weight: 600;">
                        Xin chào, <span id="greetingName" style="color:var(--durian-dark); font-weight:700; font-size:1.5rem; text-decoration: underline;"></span>!
                    </p>
                    <button id="btnCreateRoom" onclick="createRoom()" style="width: 100%; margin: 8px 0;">🚀 TẠO PHÒNG MỚI</button>
                    <button id="btnJoinRoomInput" onclick="showJoinScreen()" style="background: var(--white); color: var(--dark); width: 100%; margin: 8px 0;">🔑 NHẬP MÃ PHÒNG</button>
                    <button id="btnAutoJoin" onclick="autoJoinFromLink()" class="hidden" style="background: var(--green-main); width: 100%; margin: 8px 0;">🚀 VÀO PHÒNG NGAY</button>
                </div>
            </div>
        </div>

        <div id="join-screen" class="hidden comic-panel menu-panel" style="margin-top: 10vh;">
            <h2 style="margin-bottom:15px; font-size: 1.8rem;">🔑 Nhập mã phòng</h2>
            <input type="number" id="roomCodeInput" placeholder="VD: 123456" maxlength="6" style="font-size:2rem; letter-spacing:5px; font-weight:700;">
            <button onclick="joinRoom()" style="width: 100%; margin: 8px 0;">VÀO PHÒNG THÔI</button>
            <button onclick="backToMenu()" style="background:#CBD5E1; width: 100%; margin: 8px 0;">← Quay lại</button>
        </div>

        <div id="room-screen" class="hidden comic-panel" style="padding: 30px 20px; text-align: center;">
            <h2 style="font-size: 2.5rem; background: var(--durian); padding: 15px 30px; border-radius: 20px; border: 4px solid var(--dark); display: inline-block; margin-bottom: 20px; box-shadow: var(--shadow-solid-sm);">
                MÃ PHÒNG: <span id="roomCodeDisplay" style="color:var(--danger-dark); font-weight:900; letter-spacing: 2px;"></span>
            </h2>
            
            <div style="background: #F1F5F9; border: 3px dashed var(--dark); border-radius: 16px; padding: 12px; margin: 0 auto 25px; max-width: 400px; display: flex; gap: 10px; align-items: center;">
                <span style="font-size:1.5rem; margin-left:5px;">🔗</span>
                <input type="text" id="shareLinkInput" readonly style="flex-grow:1; margin:0; padding:10px; font-size:14px; border:2px solid var(--dark); border-radius:10px; background:var(--white); outline:none; font-weight: 500;">
                <button onclick="copyRoomLink()" id="btnCopyLink" style="margin:0; padding: 10px 15px; font-size: 14px; background: var(--green-main); border-radius:10px; box-shadow: 0px 3px 0px var(--dark);">COPY</button>
            </div>

            <p id="roomStatusText" class="status" style="background:var(--white); display:inline-block; padding:8px 20px; border-radius:20px; border:2px solid var(--dark); margin-bottom:20px; font-size: 1.1rem; box-shadow: inset 0px 3px 0px rgba(0,0,0,0.05);">Đang chờ 500 anh em...</p>
            
            <div class="player-list" id="waitingPlayerList" style="justify-content: center; gap: 15px; background: #E2E8F0; padding: 20px; border-radius: 20px; border: 3px solid var(--dark); min-height: 150px;"></div>
            
            <div style="margin-top: 30px; display:flex; flex-direction:column; gap:12px; align-items:center;">
                <button onclick="toggleReadyStatus()" id="readyButton" style="width:100%; max-width:400px; font-size:1.4rem; padding:18px; border-radius: 20px; margin: 0;">👌 TÔI SẴN SÀNG</button>
                <button onclick="forceStartAsHost()" id="hostStartButton" class="hidden" style="width:100%; max-width:400px; background:#93C5FD; font-size:1.4rem; padding:18px; border-radius: 20px; margin: 0;">🎴 CHIA BÀI NÀO (HOST)</button>
                <button onclick="leaveCurrentRoom()" style="background:transparent; color:#64748b; border:none; box-shadow:none; font-size:1rem; text-decoration: underline; margin-top:5px; padding: 5px;">Rời khỏi phòng</button>
            </div>
        </div>

        <div id="dealing-screen" class="hidden">
            <h2 style="margin-top: 20px; font-size: 2rem; text-shadow: 2px 2px 0 var(--white);">ĐANG XÀO BÀI...</h2>
            <p id="dealingStatusText" class="status" style="background: var(--white); display: inline-block; padding: 5px 15px; border-radius: 20px; border: 2px solid var(--dark);">Chọn 1 lá bài may mắn</p>
            <div class="deck-container" id="fullDeckContainer">
                </div>
        </div>

        <div id="game-screen" class="hidden">
            <div id="phaseHeaderContainer" class="phase-header"></div>
            
            <div id="nightPhase" class="hidden comic-panel" style="padding: 30px 15px; background: #334155; color: var(--white);">
                <div id="nightCaller" style="font-size: 1.3rem; min-height:80px; margin-bottom: 20px;"></div>
                <div id="nightActionPanel" class="hidden" style="background:var(--white); color:var(--dark); border-radius:20px; padding:25px; margin:0 auto; max-width:600px; border: 4px solid var(--dark); box-shadow: var(--shadow-solid);">
                    <div id="nightActionContent"></div>
                </div>
            </div>
            
            <div id="dayPhase" class="hidden comic-panel" style="padding: 20px;">
                <div class="timer" id="dayTimerDisplay">2:00</div>
                <div style="margin:10px auto; max-width:700px;">
                    <div class="chat-box" id="discussionChat"></div>
                    <div style="display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 10px;">
                        <input type="text" id="chatInput" placeholder="Chém gió đi..." style="margin:0; flex-grow: 1; text-align: left; padding: 12px 20px;" onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()" style="margin:0; padding:12px 24px; width: auto;">GỬI</button>
                    </div>
                </div>
                
                <div id="voteSection" style="margin-top: 30px; padding-top: 20px; border-top: 3px dashed var(--dark);">
                    <p style="font-size:1.2rem; font-weight:700;">Chỉ tay điểm mặt người bị loại (1 lần duy nhất)</p>
                    <div class="player-list" id="dayVoteList"></div>
                    <button id="skipVoteBtn" onclick="selectVote('SKIP')" style="background:#E2E8F0; padding: 10px 20px; width: 100%;">⏭️ Bỏ qua vòng này</button>
                    
                    <div id="confirmVoteSection" class="hidden" style="margin-top: 20px; padding: 20px; border-radius: 20px; background: var(--durian); border: 3px solid var(--dark); box-shadow: inset 0px 4px 0px rgba(255,255,255,0.5);">
                        <p style="font-size: 1.2rem; font-weight: 600;">Bạn quyết định chọn: <strong id="selectedVoteName" style="font-size:1.5rem; text-decoration: underline;"></strong>?</p>
                        <button onclick="confirmVote()" style="background:var(--green-main); color:var(--dark); margin-top: 15px; width: 100%;">✅ CHỐT ĐƠN</button>
                    </div>
                </div>
            </div>
            
            <div id="voteResultPanel" class="hidden comic-panel" style="margin-top: 20px; background:var(--danger); border-color: var(--dark);">
                <h3 id="voteResultTitle" style="line-height: 1.5; font-size: 1.6rem; color: var(--dark);"></h3>
            </div>
        </div>

        <div id="endGameScreen" class="hidden comic-panel" style="margin-top: 5vh; background: var(--durian);">
            <h1 id="endTitle" style="font-size:3rem; text-shadow: none; color: var(--dark);"></h1>
            <p id="endSubtitle" style="font-size:1.4rem; margin:15px 0 25px; font-weight: 600;"></p>
            <div id="endRoleReveal" style="text-align: left; background: var(--white); padding: 20px; border-radius: 16px; max-height: 300px; overflow-y: auto; margin-bottom: 25px; border: 3px solid var(--dark); font-size: 1.1rem; font-weight: 500; box-shadow: inset 0px 4px 8px rgba(0,0,0,0.05);"></div>
            <button onclick="returnToWaitingRoom()" style="background: var(--green-main); width: 100%; margin: 8px 0;">VỀ PHÒNG CHỜ</button>
            <button onclick="leaveCurrentRoom()" style="background: var(--white); width: 100%; margin: 8px 0;">THOÁT PHÒNG</button>
        </div>

        <div id="vetoOverlay" class="hidden">
            <div class="comic-panel" style="background:var(--white); text-align:center; max-width:400px; padding: 30px;">
                <h2 id="vetoMessage" style="color:var(--danger-dark); margin-bottom:15px; font-size: 1.6rem;">...</h2>
                <div id="vetoButtons" class="hidden">
                    <button onclick="vetoDecision(true)" style="background:var(--green-main); width:100%; margin-bottom:10px;">PHỦ QUYẾT TẾ</button>
                    <button onclick="vetoDecision(false)" style="background:#CBD5E1; width:100%;">KHÔNG PHỦ QUYẾT</button>
                </div>
                <p id="vetoTimer" style="font-size:2.5rem; font-weight:bold; margin-top:15px; color:var(--dark);">5</p>
            </div>
        </div>

        <div id="phoneOverlay" class="hidden">
            <div class="comic-panel" style="background:var(--durian); text-align:center; max-width:400px; padding: 30px; animation: bounce 0.5s infinite alternate ease-in-out;">
                <h2 style="color:var(--danger-dark); margin-bottom:15px; font-size: 1.6rem;">📱 CÓ CUỘC GỌI TỪ SỐ ẨN DANH!</h2>
                <p style="font-weight:600; margin-bottom:20px;">Nghe máy không? Kẻo nó lại phá!</p>
                <button onclick="answerPhone()" style="background:var(--green-main); width:100%; font-size: 1.5rem; padding: 20px;">📞 NHẤC MÁY</button>
            </div>
        </div>

    </div>

    <script>

            apiKey: "AIzaSyCWZHCnZRrOrX7n-fsUGJw8iTynWIK4cKQ",

        let audioContext;
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            initAudio();
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            switch(type) {
                case 'click':           
                    osc.frequency.setValueAtTime(820, now);
                    osc.type = 'sine';
                    gain.gain.value = 0.4;
                    gain.gain.linearRampToValueAtTime(0, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                    
                case 'cardPick':        
                    osc.frequency.setValueAtTime(180, now);
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.35;
                    gain.gain.linearRampToValueAtTime(0, now + 0.65);
                    osc.start(now);
                    osc.stop(now + 0.75);
                    break;
                    
                case 'flip':            
                    const notes = [620, 820, 1050];
                    notes.forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.frequency.value = freq;
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(audioContext.destination);
                        g.gain.value = 0.3;
                        g.gain.linearRampToValueAtTime(0, now + 0.45 + i * 0.1);
                        o.start(now + i * 0.05);
                        o.stop(now + 0.7 + i * 0.1);
                    });
                    break;
                    
                case 'ready':           
                    osc.frequency.setValueAtTime(440, now);
                    osc.type = 'sine';
                    gain.gain.value = 0.45;
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 1);
                    break;
                    
                case 'success':         
                    const winNotes = [700, 880, 1100, 1400];
                    winNotes.forEach((freq, i) => {
                        const o = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        o.frequency.value = freq;
                        o.type = 'sine';
                        o.connect(g);
                        g.connect(audioContext.destination);
                        g.gain.value = 0.25;
                        g.gain.linearRampToValueAtTime(0, now + 1.2 + i * 0.08);
                        o.start(now + i * 0.1);
                        o.stop(now + 1.5 + i * 0.1);
                    });
                    break;
            }
        }
        
        let particleCanvas, particleCtx, particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 8;
                this.speedX = Math.random() * 7 - 3.5;
                this.speedY = Math.random() * -12 - 4;
                this.life = 95 + Math.random() * 35;
                this.color = Math.random() > 0.5 ? '#FDE047' : '#FFFFFF';
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.15 - 0.07;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.3; 
                this.speedX *= 0.98;
                this.angle += this.spin;
                this.life -= 1.8;
                this.size *= 0.975;
            }
            draw() {
                particleCtx.save();
                particleCtx.globalAlpha = this.life / 110;
                particleCtx.translate(this.x, this.y);
                particleCtx.rotate(this.angle);
                
                particleCtx.fillStyle = this.color;
                particleCtx.beginPath();
                for(let i=0; i<5; i++){
                    particleCtx.lineTo(Math.cos( (18+i*72)/180*Math.PI ) * this.size + 0, -Math.sin( (18+i*72)/180*Math.PI ) * this.size + 0);
                    particleCtx.lineTo(Math.cos( (54+i*72)/180*Math.PI ) * (this.size*0.4) + 0, -Math.sin( (54+i*72)/180*Math.PI ) * (this.size*0.4) + 0);
                }
                particleCtx.closePath();
                particleCtx.fill();
                particleCtx.lineWidth = 2;
                particleCtx.strokeStyle = '#1E293B';
                particleCtx.stroke();
                
                particleCtx.restore();
            }
        }
        
        function emitParticles(x, y, count = 40) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        function animateParticles() {
            if (!particleCtx) return;
            particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateParticles);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function distributeRolesToAllPlayers() {
            const playersSnapshot = currentGameData.players || {};
            const playerIds = Object.keys(playersSnapshot);
            const total = playerIds.length;
            
            let wolfTarget = Math.max(1, Math.floor(total * 0.2)); 
            let thirdTarget = total >= 7 ? 1 : 0;
            let villageTarget = total - wolfTarget - thirdTarget;

            let wolvesPool = shuffleArray(CLASS_CARDS.filter(c => c.team === "wolf"));
            let thirdPool = shuffleArray(CLASS_CARDS.filter(c => c.team === "third"));
            let villagePool = shuffleArray(CLASS_CARDS.filter(c => c.team === "village"));

            let deck = [];
            
            let dauBao = wolvesPool.find(w => w.cardName.includes("Đậu Bảo"));
            if (dauBao && Math.random() < 0.75) { 
                deck.push(dauBao); 
                wolvesPool = wolvesPool.filter(w => w.id !== dauBao.id); 
                wolfTarget--; 
            }
            
            for(let i=0; i<wolfTarget; i++) deck.push(wolvesPool[i % wolvesPool.length]);
            for(let i=0; i<thirdTarget; i++) deck.push(thirdPool[i % thirdPool.length]);
            for(let i=0; i<villageTarget; i++) deck.push(villagePool[i % villagePool.length]);

            let cunIdx = deck.findIndex(c => c.cardName === "Cún");
            let thuyIdx = deck.findIndex(c => c.cardName === "Thùy");

            if (cunIdx !== -1 && thuyIdx === -1) {
                let replaceIdx = deck.findIndex(c => c.team === "village" && c.cardName !== "Cún");
                if (replaceIdx !== -1) deck[replaceIdx] = CLASS_CARDS.find(c => c.cardName === "Thùy");
            } else if (cunIdx === -1 && thuyIdx !== -1) {
                let replaceIdx = deck.findIndex(c => c.team === "village" && c.cardName !== "Thùy");
                if (replaceIdx !== -1) deck[replaceIdx] = CLASS_CARDS.find(c => c.cardName === "Cún");
            }

            deck = shuffleArray(deck);
            
            const updates = {};
            let actorExists = false;
            
            playerIds.forEach((id, index) => {
                updates["players/" + id + "/role"] = deck[index];
                updates["players/" + id + "/team"] = deck[index].team;
                updates["players/" + id + "/ready"] = false; 
                if(deck[index].cardName === "Diễn viên tồi") actorExists = true;
            });
            
            if(actorExists) {
                let safeRoles = shuffleArray(CLASS_CARDS.filter(c => c.team === "village" && !["Diễn viên tồi", "Thầy hiệu trưởng", "Cư dân sầu riêng", "Lê Hoàng Hải", "Đậu vô gia cư"].includes(c.cardName))).slice(0, 3);
                updates["actorCards"] = safeRoles;
            }
            
            roomRef.update(updates);
        }

        function handleCurrentPhase(data) {
            currentPhase = data.phase || "night";
            document.getElementById("nightPhase").classList.add("hidden");
            document.getElementById("dayPhase").classList.add("hidden");
            
            if (!window.currentVoteResultShown || window.currentVoteResultShown !== data.dayNumber) {

            document.getElementById("phaseHeaderContainer").innerHTML = `
                NGÀY ${data.dayNumber || 1} • <span style="color:${currentPhase === 'night' ? '#94A3B8' : '#F59E0B'}">${currentPhase === 'night' ? '🌒 ĐÊM XUỐNG' : '☀️ TRỜI SÁNG'}</span>`;
            
            if (currentPhase === "night") {
                handleNightSequence(data);
                document.getElementById("nightPhase").classList.remove("hidden");
            } else if (currentPhase === "day") {
                startDayDiscussion(data);
                document.getElementById("dayPhase").classList.remove("hidden");
            }
        }
        
        function handleNightSequence(data) {
            const callerDiv = document.getElementById("nightCaller");
            const actionPanel = document.getElementById("nightActionPanel");
            const playerList = Object.keys(data.players || {});
            let currentIndex = data.currentNightIndex || 0;
            
            if (isHost && currentIndex < playerList.length) {
                let nextIdx = currentIndex;
                while (nextIdx < playerList.length) {
                    let p = data.players[playerList[nextIdx]];
                    if (p && p.alive === true && p.team !== "ghost") break;
                    nextIdx++;
                }
                if (nextIdx !== currentIndex) {
                    roomRef.update({ currentNightIndex: nextIdx });
                    return; 
                }
            }
            
            if (currentIndex >= playerList.length) {
                if (isHost && currentGameData.phase === "night") {
                    let nightActions = currentGameData.nightActions || {};
                    let wolfVotes = nightActions.wolves || {};
                    let wolfKillTarget = null;
                    
                    let wCounts = {}; let wMax = 0; let wTie = false;
                    Object.values(wolfVotes).forEach(v => {
                        if(v === "SKIP") return;
                        wCounts[v] = (wCounts[v] || 0) + 1;
                        if(wCounts[v] > wMax) { wMax = wCounts[v]; wolfKillTarget = v; wTie = false; }
                        else if (wCounts[v] === wMax) { wTie = true; }
                    });
                    
                    if(wTie && !currentGameData.wolfTiebreakTimer) {
                        roomRef.update({ wolfTiebreakTimer: 15, currentNightIndex: 0 }); 
                        return;
                    }
                    if(wTie) wolfKillTarget = null; 
                    
                    let killed = [];
                    let guards = nightActions.guards || {};
                    let guardedTargets = Object.values(guards);
                    let updates = { 
                        phase: "day", votes: null, currentNightIndex: 0, 
                        "nightActions/wolves": null, "nightActions/witch": null, 
                        "nightActions/witchTarget": null, "nightActions/witchSaveTarget": null, "nightActions/guards": null,
                        "nightActions/hunterTarget": nightActions.hunterTarget || null,
                        "nightActions/vengefulBiteTarget": null, "nightActions/burnTarget": null,
                        wolfTiebreakTimer: null, phoneCall: null
                    };

                    let phoneCall = currentGameData.phoneCall;
                    if (phoneCall && phoneCall.caller) {
                        let callerId = phoneCall.caller;
                        if (phoneCall.answered) {
                            let lastDay = currentGameData.players[callerId].lastAnsweredDay;
                            if (lastDay && lastDay === currentGameData.dayNumber - 1) {
                                updates["players/" + callerId + "/aloBanned"] = true; 
                            } else {
                                updates["players/" + callerId + "/lastAnsweredDay"] = currentGameData.dayNumber;
                            }
                        } else {
                            updates["players/" + callerId + "/lastAnsweredDay"] = null; 
                        }
                    }

                    let burnTarget = nightActions.burnTarget;
                    if (burnTarget) {
                        if (wolfKillTarget === burnTarget) {
                            wolfKillTarget = null; 
                            let aliveWolvesList = Object.keys(currentGameData.players).filter(k => currentGameData.players[k].team === "wolf" && currentGameData.players[k].alive);
                            if (aliveWolvesList.length > 0) {
                                let unluckyWolfKey = aliveWolvesList[Math.floor(Math.random() * aliveWolvesList.length)];
                                let unluckyWolfName = currentGameData.players[unluckyWolfKey].name;
                                if (!killed.includes(unluckyWolfName)) killed.push(unluckyWolfName);
                            }
                        } else {
                            let targetKey = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === burnTarget);
                            if (targetKey) {
                                let oldTeam = currentGameData.players[targetKey].team;
                                updates["players/" + targetKey + "/role"] = { id: 116, cardName: "Đậu vô gia cư", role: "Đậu vô gia cư", desc: "Nhà bị cháy. Giống Cư dân sầu riêng nhưng không thể nghe điện thoại.", team: oldTeam };
                            }
                        }
                    }

                    let witchSaveTarget = nightActions.witchSaveTarget || null;
                    if (wolfKillTarget && !guardedTargets.includes(wolfKillTarget) && wolfKillTarget !== witchSaveTarget) {
                        if (!killed.includes(wolfKillTarget)) killed.push(wolfKillTarget);
                    }
                    
                    if (nightActions.witch === "poison" && nightActions.witchTarget) {
                        if (!killed.includes(nightActions.witchTarget)) killed.push(nightActions.witchTarget);
                    }
                    
                    if (nightActions.vengefulBiteTarget && !guardedTargets.includes(nightActions.vengefulBiteTarget)) {
                        if (!killed.includes(nightActions.vengefulBiteTarget)) killed.push(nightActions.vengefulBiteTarget);
                    }
                    
                    let hunterTarget = nightActions.hunterTarget;
                    let hunterDead = false;
                    Object.keys(currentGameData.players).forEach(pKey => {
                        let p = currentGameData.players[pKey];
                        if (p.role && p.role.cardName === "Người trồng sầu riêng" && killed.includes(p.name)) {
                            hunterDead = true;
                        }
                    });
                    if (hunterDead && hunterTarget && !killed.includes(hunterTarget)) {
                        killed.push(hunterTarget);
                    }
                    
                    let lovers = currentGameData.lovers || [];
                    if(lovers.length === 2) {
                        if(killed.includes(lovers[0]) && !killed.includes(lovers[1])) killed.push(lovers[1]);
                        else if(killed.includes(lovers[1]) && !killed.includes(lovers[0])) killed.push(lovers[0]);
                    }

                    updates.lastNightKills = killed;
                    
                    let aliveVillagers = 0; let aliveWolves = 0;
                    
                    Object.keys(currentGameData.players).forEach(pKey => {
                        let p = currentGameData.players[pKey];
                        
                        if(p.role && p.role.cardName === "Thầy hiệu trưởng" && killed.includes(p.name)) updates.principalDead = true;
                        
                        let isDead = killed.includes(p.name) || p.alive === false;
                        if (!isDead && p.team !== "ghost") {
                            if (p.team === "village") aliveVillagers++;
                            if (p.team === "wolf") aliveWolves++;
                        }
                        
                        if (killed.includes(p.name)) {
                            updates["players/" + pKey + "/alive"] = false;
                        }
                    });
                    
                    if (aliveWolves === 0) {
                        updates.status = "ended"; updates.winner = "village";
                    } else if (aliveVillagers === 0) {
                        updates.status = "ended"; updates.winner = "wolf";
                    }

                    roomRef.update(updates);
                }
                return;
            }
            
            const currentPlayerId = playerList[currentIndex];
            const currentPlayer = data.players[currentPlayerId];
            const me = data.players[myPlayerId];
            const isQuangHao = me && me.alive === true && myRole && myRole.cardName === "Quang Hảo";
            
            if (!currentPlayer || currentPlayer.alive !== true || currentPlayer.team === "ghost") {
                callerDiv.innerHTML = `<span style="color:#94A3B8; font-style:italic;">Đang lướt qua người đã khuất...</span>`;
                actionPanel.classList.add("hidden");
                return;
            }
            
            if (!me.alive || (isQuangHao && currentPlayerId !== myPlayerId)) {
                let prefix = !me.alive ? "👻 GÓC NHÌN HỒN MA" : "👁️ GÓC NHÌN TI HÍ";
                callerDiv.innerHTML = `<strong>${prefix}</strong><br><span style="font-size:1rem;">Hệ thống đang gọi:</span> <span style="font-size:1.6rem; color:var(--durian); font-weight:bold; border-bottom: 2px dashed var(--durian);">${currentPlayer ? currentPlayer.name : '...'}</span>`;
                actionPanel.classList.remove("hidden");
                
                if (currentPlayer && currentPlayer.alive && currentPlayer.role) {
                    renderRoleSpecificNightAction(currentPlayer.role, true);
                } else {
                    document.getElementById("nightActionContent").innerHTML = "<p>Đang lướt qua người đã chết...</p>";
                }
                return;
            }
            
            if (currentPlayerId === myPlayerId) {
                if (isQuangHao) {
                    callerDiv.innerHTML = `🌙 <strong>${myName}</strong>, chốt sổ thôi!`;
                    actionPanel.classList.remove("hidden");
                    document.getElementById("nightActionContent").innerHTML = `<p style="font-size:1.2rem; font-weight: 600;">Ti hí xong chưa? Bấm đi ngủ nào.</p><button onclick="finishNightAction()" style="margin-top:15px; width:100%; background:var(--danger); color:var(--white); border-color:var(--dark);">Đi ngủ</button>`;
                    return;
                }

        }

                <div style="background:#F1F5F9; padding: 15px; border-radius: 16px; margin-bottom: 20px; border: 3px solid var(--dark); box-shadow: inset 0px 4px 0px rgba(0,0,0,0.05);">

                     html += `<p style="color:#047857; font-weight:bold; font-size: 1.1rem; margin-bottom: 15px; background: #D1FAE5; padding: 5px; border-radius: 10px; border: 2px solid #059669;">👧 Thùy của bạn là: ${displayName} ${thuyPlayer.alive ? '' : '(Đã chết)'}</p>`;
                 }

                     let displayName = (isSpectator && cunPlayer.name === myName) ? "???" : cunPlayer.name;
                     html += `<p style="color:#047857; font-weight:bold; font-size: 1.1rem; margin-bottom: 15px; background: #D1FAE5; padding: 5px; border-radius: 10px; border: 2px solid #059669;">🐶 Cún của bạn là: ${displayName} ${cunPlayer.alive ? '' : '(Đã chết)'}</p>`;

            if (team === "wolf" || role.includes("ăn vụng") || role.includes("Vua sầu riêng") || role === "Sói đội lốt cừu" || role === "Ảo thuật gia") {
                const wolfMates = Object.values(currentGameData.players)

            } else if (role === "Sao Kê") {
                html += `<div id="witchMainUI" style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px; align-items:center;">

                            <div class="player-grid">`;
                Object.values(currentGameData.players || {}).forEach(p => {
                    let displayName = (isSpectator && p.name === myName) ? "???" : p.name;

                        html += `<button onclick="witchAction('save', '${p.name}')">${displayName}</button>`;

                html += `   </div><button onclick="hideWitchSubUI()" style="background:#CBD5E1; width:100%;">Quay lại</button>
                         </div>`;

                html += `<div id="witchPoisonUI" class="hidden">

                Object.values(currentGameData.players || {}).forEach(p => {
                    let displayName = (isSpectator && p.name === myName) ? "???" : p.name;

                        html += `<button onclick="witchAction('poison', '${p.name}')" style="background:var(--danger); color:var(--white);">${displayName}</button>`;
                    }

                html += `   </div><button onclick="hideWitchSubUI()" style="background:#CBD5E1; width:100%;">Quay lại</button>
                         </div>`;

            } else if (role === "Tiên tri" || role === "Thanh Nhàn") {
                if (role === "Thanh Nhàn" && currentGameData.thanhNhanUsed) {
                    html += `<p style="color:var(--danger-dark); font-weight:bold; font-size: 1.2rem;">❌ Đã dùng quyền Hóa Chó!</p>`;
                } else {
                    let txt = role === "Thanh Nhàn" ? "Chỉ 1 đêm duy nhất, chọn 1 người để soi:" : "Chọn 1 người để soi:";
                    html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">${txt}</p>`;
                    html += `<div class="player-grid">`;
                    Object.values(currentGameData.players || {}).forEach(p => {
                        let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                        if (p.alive === true && p.name !== myName) html += `<button onclick="seerCheck('${p.name}')">${displayName}</button>`;
                    });
                    html += `</div>`;
                }
            } else if (role === "Thần sầu duyên") {
                if (currentGameData.dayNumber > 1) {
                    html += `<p>Bạn đã hoàn thành nhiệm vụ kết duyên. Ngủ thôi.</p>`;
                } else {
                    html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">Chọn 2 người để kết duyên:</p>`;

                    html += `<div class="player-grid">`;
                    Object.values(currentGameData.players || {}).forEach(p => {
                        let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                        if (p.alive === true) html += `<button onclick="selectLover('${p.name}')">${displayName}</button>`;
                    });
                    html += `</div>`;
                }
            } else if (role === "Lương Xuân Bá" || role === "Doraemon bel") {
                if (role === "Lương Xuân Bá" && currentGameData.lxbUsed) {
                    html += `<p style="color:var(--danger-dark); font-weight:bold; font-size: 1.2rem;">❌ Đã dùng hết phân bón (chỉ dùng 1 lần)!</p>`;
                } else {
                    let txt = role === "Lương Xuân Bá" ? "Chọn 1 người để bón phân (bảo vệ):" : "Chọn 1 người để canh gác (bảo vệ):";
                    html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">${txt}</p>`;
                    html += `<div class="player-grid">`;
                    Object.values(currentGameData.players || {}).forEach(p => {
                        let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                        if (p.alive === true) {
                            let clickFunc = role === "Lương Xuân Bá" ? `lxBProtect('${p.name}')` : `guardProtect('${p.name}')`;
                            html += `<button onclick="${clickFunc}">${displayName}</button>`;

                    html += `</div>`;
                }
            } else if (role === "Phương Anh") {
                html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">Chọn 1 người để soi xem hôm qua họ vote ai:</p>`;
                html += `<div class="player-grid">`;
                Object.values(currentGameData.players || {}).forEach(p => {
                    let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                    if (p.alive === true && p.name !== myName) html += `<button onclick="phuongAnhCheck('${p.name}')">${displayName}</button>`;
                });
                html += `</div>`;
            } else if (role === "Người trồng sầu riêng") {
                html += `<p style="color:var(--danger-dark); font-weight:bold; margin-bottom: 10px;">Ghim 1 người. Nếu bạn bị chết, người đó sẽ chết chùm:</p>`;
                html += `<div class="player-grid">`;
                Object.values(currentGameData.players || {}).forEach(p => {
                    let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                    if (p.alive === true && p.name !== myName) html += `<button onclick="hunterChoose('${p.name}')">${displayName}</button>`;
                });
                html += `</div>`;
            } else if (role === "Sầu trả thù") {
                 let meData = currentGameData.players[myPlayerId];
                 if(meData && meData.vengefulActive) {
                     html += `<p style="color:var(--danger); font-weight:bold;">SỰ PHẪN NỘ CUỐI CÙNG! Chọn 1 người để lôi theo trước khi chết:</p>`;
                     html += `<div class="player-grid">`;
                     Object.values(currentGameData.players || {}).forEach(p => {
                        let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                        if (p.alive === true && p.name !== myName) html += `<button onclick="vengefulBite('${p.name}')">${displayName}</button>`;
                     });
                     html += `</div>`;
                 } else {
                     html += `<p>Ngủ ngon đi sói...</p>`;
                 }
            } else if (roleData.cardName === "Alo em ăn cơm chưa") {
                let pData = currentGameData.players[myPlayerId];
                if (pData && pData.aloBanned) {
                    html += `<p style="color:var(--danger-dark); font-size:1.2rem; font-weight:bold; background:#FFE4E6; padding:15px; border-radius:12px; border:2px solid var(--danger-dark);">❌ BẠN Đã BỊ TỔNG ĐÀI KHÓA MÁY VÌ QUẤY RỐI LIÊN TỤC 2 ĐÊM!</p>`;
                } else {
                    if (pData && pData.lastAnsweredDay && (currentGameData.dayNumber - pData.lastAnsweredDay === 1)) {
                        html += `<p style="color:#B45309; background:#FEF3C7; padding:10px; border-radius:10px; font-weight:bold; font-size:1rem; border:2px solid #F59E0B; margin-bottom:15px;">⚠️ Hôm qua đã có người nghe máy! Nếu đêm nay nhá máy tiếp mà bị nhấc máy, bạn sẽ bị KHÓA SỐ vĩnh viễn. (Khuyên: Nên nghỉ 1 đêm cho an toàn!)</p>`;
                    }
                    if (currentGameData.phoneCall && currentGameData.phoneCall.active && currentGameData.phoneCall.caller === myPlayerId) {
                        if (currentGameData.phoneCall.answered) {
                            html += `<p style="color:var(--green-main); font-size:1.4rem; font-weight:bold;">Tút tút... Đầu dây bên kia ĐÃ NHẤC MÁY!</p>`;
                            html += `<button onclick="finishNightAction()" style="background:var(--green-main); width:100%;">TẮT MÁY & ĐI NGỦ</button>`;
                        } else {
                            html += `<p style="color:var(--dark); font-size:1.2rem; font-weight:bold; animation: bounce 1s infinite;">Đang đổ chuông... chờ xíu (10s)</p>`;
                        }
                    } else {
                        html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">Chọn 1 người để nhá máy (có 10s để họ nhấc máy):</p>`;
                        html += `<div class="player-grid">`;
                        Object.values(currentGameData.players || {}).forEach(p => {
                            let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                            if (p.alive === true && p.name !== myName) html += `<button onclick="callPhone('${p.name}')">${displayName}</button>`;
                        });
                        html += `</div>`;
                    }
                }
            } else if (roleData.cardName === "Đậu Bảo ăn trộm") {
                if ((currentGameData.dayNumber - 1) % 3 === 0) {
                    html += `<p style="color:var(--danger-dark); font-weight:bold; margin-bottom: 10px;">Mỗi 3 đêm, bạn được đốt 1 nhà:</p>`;
                    html += `<div class="player-grid">`;
                    Object.values(currentGameData.players || {}).forEach(p => {
                        let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                        if (p.alive === true && p.name !== myName) html += `<button onclick="burnHouse('${p.name}')">${displayName}</button>`;
                    });
                    html += `</div>`;
                } else {
                    html += `<p>Kỹ năng đang nạp (3 đêm dùng 1 lần). Vui lòng ngủ tiếp.</p>`;
                }
            } else if (["Hoài Anh", "Thằng giấu xe", "Đậu mất xe", "Minh Nguyên"].includes(roleData.cardName)) {
                html += `<p style="color:var(--dark); font-weight:bold; margin-bottom: 10px;">Chọn 1 mục tiêu để dùng kỹ năng:</p>`;
                html += `<div class="player-grid">`;
                Object.values(currentGameData.players || {}).forEach(p => {
                    let displayName = (isSpectator && p.name === myName) ? "???" : p.name;
                    if (p.alive === true && p.name !== myName) html += `<button onclick="genericAction('${p.name}')">${displayName}</button>`;
                });
                html += `</div>`;
            } else {
                html += `<p style="color: #64748B; font-style: italic; font-weight: 500;">(Chức năng tự động hoặc không làm gì đêm nay)</p>`;
            }
            html += `</div>`;

            if (!isSpectator) {
                let hideStandardFinishBtn = (roleData.cardName === "Sao Kê") || 
                                            (roleData.cardName === "Alo em ăn cơm chưa" && currentGameData.phoneCall && currentGameData.phoneCall.active && currentGameData.phoneCall.caller === myPlayerId);
                
                if (!hideStandardFinishBtn) {
                    if(team !== "wolf") {
                        html += `<button onclick="finishNightAction()" style="margin-top:20px; width:100%; background:var(--danger); border-color: var(--dark); color: var(--white);">Xong & Ngủ</button>`;
                    } else {
                         html += `<button onclick="finishNightAction()" style="margin-top:20px; width:100%; background:var(--danger); border-color: var(--dark); color: var(--white);">Chốt phiếu hội đồng</button>`;
                    }
                }
            }
            
            container.innerHTML = html;
