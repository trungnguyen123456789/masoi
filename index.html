            const timerEl = document.getElementById("nightTimerDisplay");
            if (nightTimer) clearInterval(nightTimer);
            
            nightTimer = setInterval(() => {
                timeLeft--;
                if (timerEl) timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(nightTimer);
                    if (!isSpectator) {
                        finishNightAction();
                    }
                }
            }, 1000);
        }
        
        function actorChooseRole(cardName) {
            let selected = currentGameData.actorCards.find(c => c.cardName === cardName);
            if(selected) {
                renderRoleSpecificNightAction(selected, false);
            }
        }
        
        function selectLover(name) {
            if(localLoverSelections.includes(name)) return;
            localLoverSelections.push(name);
            document.getElementById("loverSelectStatus").innerText = "Đã chọn: " + localLoverSelections.join(" & ");
            if(localLoverSelections.length === 2) {
                if(roomRef) roomRef.child("lovers").set(localLoverSelections);
                alert("Đã kết duyên " + localLoverSelections[0] + " và " + localLoverSelections[1]);
                playSound('success');
                finishNightAction();
            }
        }

        function quynhAnhLockVote(targetName) { 
            if (roomRef) {
                roomRef.child("nightActions/quynhAnhTarget").set(targetName); 
                roomRef.child("quynhAnhUsed").set(true); 
            }
            playSound('click');
            finishNightAction(); 
        }

        function wolfChooseVictim(name) { 
            if (roomRef) roomRef.child("nightActions/wolves/" + myPlayerId).set(name); 
            playSound('click');
        }
        
        function vengefulBite(name) {
            if (roomRef) roomRef.child("nightActions/vengefulBiteTarget").set(name);
            playSound('click');
            finishNightAction();
        }

        function witchAction(type, targetName = null) { 
            if (roomRef) {
                roomRef.child("nightActions/witch").set(type); 
                if (type === 'save' && targetName) {
                    roomRef.child("nightActions/witchSaveTarget").set(targetName);
                    roomRef.child("witchSaveUsed").set(true);
                }
                if (type === 'poison' && targetName) {
                    roomRef.child("nightActions/witchTarget").set(targetName);
                    roomRef.child("witchPoisonUsed").set(true);
                }
            }
            playSound('click');
            finishNightAction(); 
        }

        function lxBProtect(name) { 
            if (roomRef) {
                roomRef.child("nightActions/guards/" + myPlayerId).set(name); 
                roomRef.child("lxbUsed").set(true); 
            }
            playSound('click');
            finishNightAction(); 
        }

        function guardProtect(name) { 
            if (roomRef) roomRef.child("nightActions/guards/" + myPlayerId).set(name); 
            playSound('click');
            finishNightAction(); 
        }

        function callPhone(name) {
            if (roomRef) roomRef.child("phoneCall").set({ caller: myPlayerId, target: name, active: true, timestamp: Date.now(), answered: false });
            playSound('click');
            setTimeout(() => {
                if (currentGameData.phoneCall && currentGameData.phoneCall.active) {
                    roomRef.child("phoneCall/active").set(false);
                    finishNightAction();
                }
            }, 10000);
        }

        function burnHouse(name) {
            if (roomRef) roomRef.child("nightActions/burnTarget").set(name);
            alert(`🔥 Đã đổ xăng vào nhà ${name}. Chờ xem Sói có mò tới không...`);
            playSound('click');
            finishNightAction(); 
        }
        
        function phuongAnhCheck(name) { 
            const targetId = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === name);
            const lastVotes = currentGameData.lastDayVotes || {};
            const voteTarget = lastVotes[targetId];
            if (voteTarget && voteTarget !== "SKIP") {
                alert(`🕵️ Hôm qua [${name}] đã vote cho: ${voteTarget}`);
            } else {
                alert(`🕵️ Hôm qua [${name}] KHÔNG VOTE hoặc BỎ QUA.`);
            }
            playSound('success');
            finishNightAction(); 
        }

        function hunterChoose(name) {
            if (roomRef) roomRef.child("nightActions/hunterTarget").set(name);
            alert(`🎯 Đã ghim ${name}! Nếu bạn chết, hắn sẽ chết theo.`);
            playSound('click');
            finishNightAction();
        }

        function genericAction(name) {
            alert(`✅ Đã dùng kỹ năng lên: ${name}`);
            playSound('click');
            finishNightAction();
        }

        function seerCheck(name) { 
            const target = Object.values(currentGameData.players || {}).find(p => p.name === name);
            if (!target) return finishNightAction();

            let resultText = "";
            if (myRole.cardName === "Tiên tri" || (myRole.cardName === "Diễn viên tồi" && document.getElementById("nightActionContent").innerHTML.includes("Tiên tri"))) {
                if (target.role.id === 34) resultText = "Nông dân 🧑‍🌾"; 
                else if (target.team === "wolf") resultText = "Sói/Sầu Riêng 🐺"; 
                else resultText = "Nông dân 🧑‍🌾"; 
                alert(`🔮 Kết quả soi: [${name}] là ${resultText}`);
            } else if (myRole.cardName === "Thanh Nhàn") {
                if (roomRef) roomRef.child("thanhNhanUsed").set(true);
                if (target.role.role === "Cư dân sầu riêng" || target.role.role === "Đậu Bảo" || target.role.role === "Đậu vô gia cư") resultText = "KHÔNG CÓ chức năng ❌";
                else resultText = "CÓ chức năng đặc biệt ⚡";
                alert(`🧪 Hóa Chó: [${name}] ${resultText}`);
            } else {
                alert(`Đã ghi nhận tương tác với: ${name}`);
            }
            playSound('success');
            finishNightAction(); 
        }
        
        function finishNightAction() {
            if (nightTimer) clearInterval(nightTimer);
            if (roomRef) {
                if(myRole && myRole.team === "wolf" && !currentGameData.wolfTiebreakTimer) {
                    document.getElementById("nightActionPanel").classList.add("hidden");
                }
                let idx = (currentGameData.currentNightIndex || 0) + 1;
                roomRef.update({ currentNightIndex: idx });
            }
            document.getElementById("nightActionPanel").classList.add("hidden");
        }
        
        function startDayDiscussion(data) {
            const timerEl = document.getElementById("dayTimerDisplay");
            pendingVoteTarget = null;
            window.isCalculatingVote = false;
            localLoverSelections = []; 
            
            let killMsg = (data.lastNightKills && data.lastNightKills.length > 0) 
                ? `<div style="font-size:1.1rem; color:var(--danger-dark); margin-bottom:5px; font-weight:700;">💀 Đứt bóng: ${data.lastNightKills.join(", ")}!</div>`
                : `<div style="font-size:1.1rem; color:var(--green-main); margin-bottom:5px; font-weight:700;">🌅 Đêm qua an toàn!</div>`;
            
            if(data.lovers && data.lovers.includes(myName)) {
                 let theOther = data.lovers[0] === myName ? data.lovers[1] : data.lovers[0];
                 killMsg += `<div style="font-size:1rem; color:#E11D48;">💘 Tình nhân của bạn là: ${theOther}</div>`;
            }

            if (!window.currentDayNum || window.currentDayNum !== data.dayNumber) {
                window.currentDayNum = data.dayNumber;
                window.timeLeftDay = 120;
            }
            
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (window.isCalculatingVote) return; 
                
                const aliveC = Object.values(currentGameData.players || {}).filter(p => p.alive === true && p.team !== "ghost" && p.revealedIdiot !== true).length;
                const voteC = Object.keys(currentGameData.votes || {}).length;
                
                if (voteC >= aliveC && aliveC > 0 && window.timeLeftDay > 0) window.timeLeftDay = 0; 
                else window.timeLeftDay--;
                
                if (window.timeLeftDay < 0) window.timeLeftDay = 0;
                const m = Math.floor(window.timeLeftDay / 60);
                const s = window.timeLeftDay % 60;
                timerEl.innerHTML = killMsg + `${m}:${s < 10 ? '0' : ''}${s}`;
                
                if (window.timeLeftDay <= 0 && !window.isCalculatingVote) {
                    window.isCalculatingVote = true; 
                    clearInterval(gameTimer);
                    if (isHost) calculateDayVoteResult();
                }
            }, 1000);
            
            const lockedPlayer = data.nightActions ? data.nightActions.quynhAnhTarget : null;
            if (lockedPlayer === myName && (!window.alertedLockDay || window.alertedLockDay !== data.dayNumber)) {
                alert("⚠️ Ủa alo? Bạn đã bị Quỳnh Anh khóa miệng! Phiếu của bạn hôm nay vô tác dụng.");
                window.alertedLockDay = data.dayNumber;
            }
            
            const me = data.players[myPlayerId];
            const voteSection = document.getElementById("voteSection");
            
            if (data.votes && data.votes[myPlayerId]) {
                 voteSection.innerHTML = `<p style='color:var(--green-main); font-size:1.3rem; font-weight:700;'>✅ Đã chốt đơn. Ngồi chơi xơi nước...</p>`;
            } else if (!me.alive) {
                voteSection.innerHTML = "<p style='color:var(--danger-dark); font-size:1.2rem; font-weight:700;'>👻 Bạn tạch rồi. Chỉ được chat, không được vote.</p>";
            } else if (me.revealedIdiot) {
                voteSection.innerHTML = "<p style='color:var(--danger-dark); font-size:1.2rem; font-weight:700;'>🤡 Thằng Tột làm gì được quyền vote.</p>";
            } else {
                voteSection.innerHTML = `
                    <p style="margin:10px 0; color:var(--dark); font-size:1.2rem; font-weight:600;">Ai là kẻ thủ ác? Trảm nó!</p>
                    <div class="player-grid" id="dayVoteList"></div>
                    <button id="skipVoteBtn" onclick="selectVote('SKIP')" style="background:#E2E8F0; padding: 10px 20px; width: 100%;">⏭️ BỎ QUA VÒNG NÀY</button>
                    
                    <div id="confirmVoteSection" class="hidden" style="margin-top: 15px; padding: 20px; border-radius: 16px; background: #FEF9C3; border: 3px solid var(--dark); box-shadow: var(--shadow-solid-sm);">
                        <p style="font-weight: 600; font-size: 1.1rem;">Chốt sổ đứa này: <strong id="selectedVoteName" style="color:var(--danger-dark); font-size:1.5rem; text-decoration: underline;"></strong>?</p>
                        <button onclick="confirmVote()" style="background:var(--green-main); color:var(--dark); width:100%; margin-top:10px;">✅ CHỐT</button>
                    </div>
                `;
                renderDayVoteButtons(data);
            }
        }
        
        function renderDayVoteButtons(data) {
            const container = document.getElementById("dayVoteList");
            if (!container) return;
            container.innerHTML = "";
            Object.values(data.players || {}).forEach(player => {
                if (player.alive !== true) return;
                if (player.name === myName) return; 

                const btn = document.createElement("button");
                btn.style.background = "var(--white)";
                btn.style.color = "var(--dark)";
                btn.style.boxShadow = "2px 2px 0px var(--dark)";
                btn.innerText = player.name;
                btn.id = `voteBtn_${player.name}`;
                btn.onclick = () => selectVote(player.name);
                container.appendChild(btn);
            });
        }
        
        function selectVote(target) {
            pendingVoteTarget = target;
            document.getElementById("confirmVoteSection").classList.remove("hidden");
            document.getElementById("selectedVoteName").innerText = target === 'SKIP' ? 'BỎ QUA MÀ ĐÚNG KHÔNG' : target;
            
            document.querySelectorAll("#dayVoteList button, #skipVoteBtn").forEach(btn => { 
                btn.style.borderColor = "var(--dark)";
                if(btn.id !== 'skipVoteBtn') {
                    btn.style.background = "var(--white)";
                    btn.style.color = "var(--dark)";
                }
            });
            
            let selectedBtn = target === 'SKIP' ? document.getElementById("skipVoteBtn") : document.getElementById(`voteBtn_${target}`);
            if(selectedBtn) { 
                if(target !== 'SKIP') {
                    selectedBtn.style.background = "var(--durian)";
                }
            }
            playSound('click');
        }

        function confirmVote() {
            if (!roomRef || !pendingVoteTarget) return;
            roomRef.child("votes/" + myPlayerId).set(pendingVoteTarget);
            document.getElementById("voteSection").innerHTML = `<p style='color:var(--green-main); font-size:1.3rem; font-weight:700;'>✅ CHỐT! Chờ xem drama...</p>`;
            playSound('success');
        }

        function vetoDecision(isVeto) {
            playSound('click');
            if (isVeto) {
                roomRef.child("vetoPhase/decision").set("YES");
            } else {
                roomRef.child("vetoPhase/decision").set("NO");
            }
            document.getElementById("vetoButtons").classList.add("hidden");
            document.getElementById("vetoMessage").innerText = "Đã ghi nhận lựa chọn. Chờ một chút...";
        }

        function executeDayKill(eliminated, maxVotes, requiredVotes, isTie, votesToSave) {
            let finalTitle = "";
            let finalSubtitle = "";
            let updates = {};
            
            if (isTie) {
                finalTitle = "⚖️ HUỀ CẢ LÀNG";
                finalSubtitle = `Số phiếu bằng nhau. Cả lớp đi ngủ...`;
            } else if (eliminated && maxVotes >= requiredVotes) {
                const playerKey = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === eliminated);
                let p = currentGameData.players[playerKey];
                
                if (p && p.role && p.role.cardName === "Thằng tột" && !p.revealedIdiot) {
                    updates["players/" + playerKey + "/revealedIdiot"] = true;
                    finalTitle = `🤡 <span style="text-decoration:underline;">${eliminated}</span> LÀ THẰNG TỘT!`;
                    finalSubtitle = `Đã hiện nguyên hình, được tha mạng nhưng mất quyền vote!`;
                } 
                else if (p && p.role && p.role.cardName === "Sầu trả thù") {
                    updates["players/" + playerKey + "/vengefulActive"] = true;
                    finalTitle = `👿 <span style="text-decoration:underline;">${eliminated}</span> LÀ SẦU TRẢ THÙ!`;
                    finalSubtitle = `Hắn bị tế nhưng vẫn trụ được thêm 1 đêm để trả đũa!`;
                }
                else if (p && p.role && p.role.cardName === "Lê Hoàng Hải" && currentGameData.principalDead && !p.shieldUsed) {
                     updates["players/" + playerKey + "/shieldUsed"] = true;
                     finalTitle = `🛡️ TRƯỞNG LÀNG SỐNG DAI!`;
                     finalSubtitle = `Hiệu trưởng ban phước, Trưởng làng đỡ được 1 hit tế!`;
                }
                else if (playerKey) {
                    updates["players/" + playerKey + "/alive"] = false;
                    
                    let lovers = currentGameData.lovers || [];
                    if(lovers.includes(eliminated)) {
                        let theOther = lovers[0] === eliminated ? lovers[1] : lovers[0];
                        const otherKey = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === theOther);
                        if(otherKey) updates["players/" + otherKey + "/alive"] = false;
                    }
                    
                    if(p.role && p.role.cardName === "Thầy hiệu trưởng") {
                        updates.principalDead = true;
                    }

                    finalTitle = `💀 <span style="text-decoration:underline;">${eliminated}</span> LÊN BẢNG ĐẾM SỐ!`;
                    finalSubtitle = `Bị tế với ${maxVotes}/${alivePlayersCount} phiếu. Đi ngủ...`;
                    
                    if (p && p.role && p.role.cardName === "Người trồng sầu riêng") {
                        const hTarget = currentGameData.nightActions ? currentGameData.nightActions.hunterTarget : null;
                        if (hTarget) {
                            const hTargetKey = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === hTarget);
                            if (hTargetKey && currentGameData.players[hTargetKey].alive === true) {
                                updates["players/" + hTargetKey + "/alive"] = false;
                                finalSubtitle = `Người trồng sầu riêng đã nổ súng kéo theo ${hTarget} chết cùng! Đi ngủ...`;
                            }
                        }
                    }
                }
            } else {
                finalTitle = "🕊️ KHÔNG AI BỊ TẾ";
                finalSubtitle = `Phiếu cao nhất (${maxVotes}) chưa đạt yêu cầu (cần ${requiredVotes} phiếu). Đi ngủ...`;
            }
            
            updates.dayVoteResult = { title: finalTitle, subtitle: finalSubtitle, day: currentGameData.dayNumber };
            updates.lastDayVotes = votesToSave || {};
            
            roomRef.update(updates);
            
            setTimeout(() => {
                if (roomRef) {
                    roomRef.once("value", snap => {
                        let d = snap.val();
                        if (!d) return;
                        
                        let vCount = 0; let wCount = 0;
                        Object.values(d.players || {}).forEach(p => {
                            if (p.alive === true && p.team !== "ghost") {
                                if (p.team === "village") vCount++;
                                if (p.team === "wolf") wCount++;
                            }
                        });

                        if (wCount === 0) {
                            roomRef.update({ status: "ended", winner: "village" });
                        } else if (vCount === 0) {
                            roomRef.update({ status: "ended", winner: "wolf" });
                        } else {
                            Object.keys(d.players || {}).forEach(k => {
                                if(d.players[k].vengefulActive && d.players[k].alive) {
                                    roomRef.child("players/" + k + "/alive").set(false);
                                }
                            });

                            roomRef.update({ 
                                phase: "night", currentNightIndex: 0, dayNumber: (d.dayNumber || 1) + 1, 
                                votes: null, dayVoteResult: null, "nightActions/quynhAnhTarget": null, vetoPhase: null 
                            });
                        }
                    });
                }
            }, 6000);
        }
        
        function calculateDayVoteResult() {
            if (!roomRef || !isHost || currentGameData.phase !== "day") return;
            
            const votes = currentGameData.votes || {};
            const lockedPlayer = currentGameData.nightActions ? currentGameData.nightActions.quynhAnhTarget : null;
            const voteCount = {};
            
            let lockedPlayerId = null;
            if (lockedPlayer) lockedPlayerId = Object.keys(currentGameData.players).find(k => currentGameData.players[k].name === lockedPlayer);
            
            Object.entries(votes).forEach(([voterId, targetName]) => {
                if (targetName === "SKIP" || voterId === lockedPlayerId) return;
                const voter = currentGameData.players[voterId];
                if(voter.revealedIdiot) return; 
                
                let weight = 1;
                if (voter && voter.role) {
                    if (voter.role.cardName === "Lê Hoàng Hải") weight = 2;
                    if (voter.role.cardName === "Cún") {
                        let thuy = Object.values(currentGameData.players).find(p => p.role && p.role.cardName === "Thùy");
                        if (thuy && thuy.alive === false) weight = 2;
                    }
                    if (voter.role.cardName === "Thùy") {
                        let cun = Object.values(currentGameData.players).find(p => p.role && p.role.cardName === "Cún");
                        if (cun && cun.alive === false) weight = 2;
                    }
                }
                voteCount[targetName] = (voteCount[targetName] || 0) + weight;
            });
            
            let maxVotes = 0, eliminated = null, isTie = false;
            Object.entries(voteCount).forEach(([name, count]) => {
                if (count > maxVotes) { maxVotes = count; eliminated = name; isTie = false; } 
                else if (count === maxVotes) { isTie = true; }
            });
            
            const requiredVotes = Math.ceil(alivePlayersCount * 0.5); 

            let coLoanPlayer = Object.entries(currentGameData.players).find(([k, p]) => p.role && p.role.cardName === "Cô Loan" && p.alive);
            if (coLoanPlayer && !currentGameData.coLoanUsed && eliminated && maxVotes >= requiredVotes && !isTie) {
                window.vetoProcessed = false; // Reset cờ xử lý chống dính vòng lặp
                roomRef.update({
                    vetoPhase: {
                        active: true,
                        target: eliminated,
                        expires: Date.now() + 5000,
                        votes: votes,
                        maxVotes: maxVotes,
                        requiredVotes: requiredVotes
                    }
                });

                // Ép tự động đóng và tử hình (NO) nếu Cô Loan treo máy không ấn
                setTimeout(() => {
                    if (roomRef && isHost) {
                        roomRef.once('value', snap => {
                            let d = snap.val();
                            if (d && d.vetoPhase && d.vetoPhase.active && !d.vetoPhase.decision) {
                                roomRef.child("vetoPhase/decision").set("NO");
                            }
                        });
                    }
                }, 5500);

                return; 
            }

            executeDayKill(eliminated, maxVotes, requiredVotes, isTie, votes);
        }
        
        function showVoteResult(titleHTML, subtitle) {
            document.getElementById("voteResultPanel").classList.remove("hidden");
            document.getElementById("voteResultTitle").innerHTML = `${titleHTML}<br><span style="font-size:1.1rem; opacity:0.8; display:block; margin-top:5px; font-weight:600; color: var(--dark);">${subtitle}</span>`;
        }
        
        function renderChat(chatData) {
            const chatBox = document.getElementById("discussionChat");
            if (!chatBox) return;
            const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 10;
            
            let html = `<div style="text-align:center; opacity:0.5; padding:5px; font-size:0.9rem; font-weight:600;">Tranh luận đeeee...</div>`;
            if (chatData) {
                Object.values(chatData).forEach(msg => {
                    const isSelf = msg.name.includes(myName) ? "self" : "";
                    const isGhost = msg.name.includes("[HỒN MA]") ? "ghost" : "";
                    html += `<div class="chat-message ${isSelf} ${isGhost}"><strong>${msg.name}:</strong> ${msg.text}</div>`;
                });
            }
            chatBox.innerHTML = html;
            if (isScrolledToBottom) chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById("chatInput");
            const msg = input.value.trim();
            if (!msg || !roomRef) return;
            
            const me = currentGameData.players[myPlayerId];
            const prefix = (!me || !me.alive) ? "[HỒN MA] " : "";
            roomRef.child("chat").push({ name: prefix + myName, text: msg, time: Date.now() });
            input.value = "";
            playSound('click');
        }
        
        function showEndGameScreen(data) {
            showScreen("endGameScreen");
            
            if (data.winner === "wolf") {
                document.getElementById("endTitle").innerHTML = `🐺 SÓI THẮNG RỒI!`;
                document.getElementById("endSubtitle").innerHTML = `Lớp học đã bị xơi tái không còn 1 mống!`;
                document.getElementById("endGameScreen").style.background = "var(--danger)";
            } else {
                document.getElementById("endTitle").innerHTML = `🏆 LỚP HỌC THẮNG!`;
                document.getElementById("endSubtitle").innerHTML = `Sói đã bị tiêu diệt hoàn toàn!`;
                document.getElementById("endGameScreen").style.background = "var(--green-main)";
            }
            
            let revealHTML = "<h3 style='margin-bottom: 10px; color: var(--dark);'>BẢNG VÀNG THÀNH TÍCH:</h3>";
            Object.values(data.players || {}).forEach(p => {
                if (p.team !== "ghost") {
                    const aliveStr = p.alive ? '<span style="color:var(--green-main);">[Sống]</span>' : '<span style="color:var(--danger-dark);">[Chết]</span>';
                    revealHTML += `<div style="margin:8px 0; border-bottom: 2px dotted #CBD5E1; padding-bottom:5px;">${aliveStr} ${p.name} → <strong>${p.role ? p.role.role : 'Không rõ'}</strong></div>`;
                }
            });
            document.getElementById("endRoleReveal").innerHTML = revealHTML;
            playSound('success');
        }
        
        window.addEventListener("load", () => { initAudio(); });
        window.addEventListener("beforeunload", () => {
            if (roomRef && myPlayerId && !isHost) {
                roomRef.child("players/" + myPlayerId).remove();
            }
        });
    </script>
</body>
</html>
